<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GreenBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar-container"></div>
    <div id="modal-container"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Admin Dashboard</h1>
        <p class="text-gray-600 mb-8">Manage ideas submitted by innovators.</p>
        
        <!-- Tabs -->
        <div class="mb-6 border-b border-gray-200">
            <nav class="-mb-px flex space-x-8">
                <button onclick="switchTab('ideas')" id="tab-ideas" class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm border-green-500 text-green-600">Ideas</button>
                <button onclick="switchTab('ngos')" id="tab-ngos" class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">NGOs & Campaigns</button>
                <button onclick="switchTab('vols')" id="tab-vols" class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">Global Volunteers</button>
            </nav>
        </div>
        
        <!-- Ideas Tab -->
        <div id="content-ideas" class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Idea</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Category</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Featured</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table" class="bg-white divide-y divide-gray-200">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- NGOs Tab -->
        <div id="content-ngos" class="hidden space-y-6">
            <!-- Rendered by JS -->
        </div>

        <!-- Volunteers Tab -->
        <div id="content-vols" class="hidden space-y-6">
            <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100 p-6">
                <h2 class="text-xl font-bold mb-4">Global Volunteer History</h2>
                <ul id="global-vol-list" class="divide-y divide-gray-100">
                    <!-- Rendered by JS -->
                </ul>
            </div>
            <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100 p-6">
                <h2 class="text-xl font-bold mb-4">Volunteer Badge Management</h2>
                <ul id="volunteer-badge-list" class="divide-y divide-gray-100">
                    <!-- Rendered by JS -->
                </ul>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = getDB();
            if (!db.currentUser || !['Admin', 'Founder', 'Team Member'].includes(db.currentUser.role)) {
                alert("Unauthorized! Please login as Admin, Founder, or Team Member.");
                window.location.href = 'index.html';
                return;
            }
            renderTable();
            renderNGOs();
            renderVolunteers();
        });

        function switchTab(tab) {
            ['ideas', 'ngos', 'vols'].forEach(t => {
                document.getElementById('content-' + t).classList.add('hidden');
                const btn = document.getElementById('tab-' + t);
                btn.classList.remove('border-green-500', 'text-green-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            document.getElementById('content-' + tab).classList.remove('hidden');
            const activeBtn = document.getElementById('tab-' + tab);
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
            activeBtn.classList.add('border-green-500', 'text-green-600');
        }

        function renderTable() {
            const db = getDB();
            const tbody = document.getElementById('admin-table');
            
            if (db.innovators.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No ideas found.</td></tr>`;
                return;
            }

            tbody.innerHTML = db.innovators.map(idea => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="h-10 w-10 flex-shrink-0 rounded-lg overflow-hidden mr-3">
                                <img src="${idea.image}" onerror="this.onerror=null;this.src='https://placehold.co/100/png?text=Idea';" class="w-full h-full object-cover">
                            </div>
                            <div class="text-sm font-bold text-gray-900">${idea.title}</div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${idea.category}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-xs leading-5 font-bold rounded-full ${idea.status === 'approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                            ${idea.status.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        ${idea.featured ? '<i data-lucide="star" class="w-5 h-5 text-yellow-500 fill-current"></i>' : '<i data-lucide="star" class="w-5 h-5 text-gray-300"></i>'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 flex items-center h-full">
                        <button onclick="openChatModal('${idea.title.replace(/'/g, "\\'")}')" class="text-blue-600 hover:text-blue-900 bg-blue-50 px-3 py-1 rounded inline-flex items-center"><i data-lucide="message-circle" class="w-4 h-4 mr-1"></i> Chat</button>
                        ${idea.status === 'pending' ? `
                            <button onclick="approveIdea('${idea.id}')" class="text-green-600 hover:text-green-900 bg-green-50 px-3 py-1 rounded">Approve</button>
                        ` : ''}
                        ${idea.status === 'approved' && !idea.featured ? `
                            <button onclick="featureIdea('${idea.id}')" class="text-yellow-600 hover:text-yellow-900 bg-yellow-50 px-3 py-1 rounded">Feature</button>
                        ` : ''}
                        ${idea.featured ? `
                            <button onclick="unfeatureIdea('${idea.id}')" class="text-gray-600 hover:text-gray-900 bg-gray-100 px-3 py-1 rounded">Unfeature</button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function renderNGOs() {
            const db = getDB();
            const container = document.getElementById('content-ngos');
            container.innerHTML = db.ngos.map(ngo => {
                const campaigns = db.campaigns.filter(c => c.ngoId === ngo.id);
                
                // Count volunteer history
                let totalVolsEngaged = 0;
                let activeCampaignsHtml = '';
                let volHistoryHtml = '';
                
                campaigns.forEach(c => {
                    const parts = c.participants || [];
                    const completedVols = parts.filter(p => p.status === 'completed');
                    totalVolsEngaged += completedVols.length;
                    
                    activeCampaignsHtml += `
                        <div class="mb-3 border-l-4 border-blue-500 pl-3 py-1">
                            <p class="font-bold text-sm text-gray-800">${c.title} <span class="text-xs text-gray-500 font-normal">(${c.date})</span></p>
                            <p class="text-xs text-gray-600">Location: ${c.location} | Need: ${parts.length} / ${c.volunteersNeeded} Volunteers</p>
                        </div>
                    `;
                    
                    completedVols.forEach(p => {
                        const vol = db.volunteers.find(v => v.id === p.volunteerId);
                        volHistoryHtml += `<li>${vol ? vol.name : 'Unknown'} - ${c.title}</li>`;
                    });
                });
                
                if (!activeCampaignsHtml) activeCampaignsHtml = '<p class="text-xs text-gray-500">No campaigns yet.</p>';
                if (!volHistoryHtml) volHistoryHtml = '<li>No completed volunteers yet.</li>';

                let reviewsHtml = '';
                if (ngo.reviews && ngo.reviews.length > 0) {
                    reviewsHtml = `
                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <h4 class="font-bold text-sm text-gray-700 mb-2 uppercase tracking-wider">Volunteer Reviews</h4>
                            <ul class="space-y-2">
                                ${ngo.reviews.map(r => `
                                    <li class="bg-yellow-50 p-2 rounded-lg border border-yellow-100 text-xs">
                                        <p class="text-gray-700 italic">"${r.text}"</p>
                                        <p class="text-gray-500 mt-1">- ${r.volunteerName} (${r.date})</p>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                }

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                        <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-100">
                            <div class="flex items-center space-x-4">
                                <img src="${ngo.image || 'https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=100'}" class="w-12 h-12 rounded-full object-cover shadow-sm">
                                <div>
                                    <p class="font-bold text-lg text-gray-800">${ngo.name}</p>
                                    <p class="text-xs text-gray-500">Total Campaigns Run: ${campaigns.length} | Total Volunteers Engaged: ${totalVolsEngaged}</p>
                                </div>
                            </div>
                            <button onclick="openChatModal('${ngo.name.replace(/'/g, "\\'")}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center transition">
                                <i data-lucide="message-circle" class="w-4 h-4 mr-1"></i> Message NGO
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="font-bold text-sm text-gray-700 mb-2 uppercase tracking-wider">Current Campaigns</h4>
                                ${activeCampaignsHtml}
                                ${reviewsHtml}
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-700 mb-2 uppercase tracking-wider">Volunteer History</h4>
                                <ul class="text-xs text-gray-600 list-disc pl-4 space-y-1">
                                    ${volHistoryHtml}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderVolunteers() {
            const db = getDB();
            const list = document.getElementById('global-vol-list');
            let historyHtml = '';
            
            db.campaigns.forEach(camp => {
                if (camp.participants) {
                    camp.participants.forEach(p => {
                        if (p.status === 'completed') {
                            const volInfo = db.volunteers.find(v => v.id === p.volunteerId);
                            const ngoInfo = db.ngos.find(n => n.id === camp.ngoId);
                            historyHtml += `
                                <li class="py-3 flex justify-between items-center">
                                    <div>
                                        <p class="font-bold text-sm text-gray-800">${volInfo ? volInfo.name : 'Unknown'}</p>
                                        <p class="text-xs text-gray-500">Campaign: ${camp.title} by ${ngoInfo ? ngoInfo.name : 'Unknown NGO'}</p>
                                    </div>
                                    <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded">${camp.date}</span>
                                </li>
                            `;
                        }
                    });
                }
            });
            list.innerHTML = historyHtml || '<p class="text-sm text-gray-500">No completed volunteers yet.</p>';

            const badgeList = document.getElementById('volunteer-badge-list');
            let badgeHtml = '';
            db.volunteers.forEach(vol => {
                const badges = vol.badges || [];
                const badgeTags = badges.map(b => `<span class="px-2 py-1 text-xs bg-purple-100 text-purple-800 rounded-full font-bold mr-1">${b}</span>`).join('');
                
                badgeHtml += `
                    <li class="py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <p class="font-bold text-sm text-gray-800">${vol.name}</p>
                            <div class="mt-1 flex flex-wrap gap-1">
                                ${badgeTags || '<span class="text-xs text-gray-400 italic">No badges yet</span>'}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                            <button onclick="openChatModal('${vol.name.replace(/'/g, "\\'")}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded text-sm font-bold flex items-center transition h-[34px]">
                                <i data-lucide="message-circle" class="w-4 h-4 mr-1"></i> Chat
                            </button>
                            <select id="badge-input-${vol.id}" class="w-full sm:w-40 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-green-500 h-[34px]">
                                <option value="" disabled selected>Select Badge...</option>
                                <option value="Green Champion">Green Champion</option>
                                <option value="First Campaign">First Campaign</option>
                                <option value="Eco Warrior">Eco Warrior</option>
                                <option value="Community Leader">Community Leader</option>
                                <option value="Zero Waste Hero">Zero Waste Hero</option>
                            </select>
                            <button onclick="awardBadge('${vol.id}')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded text-sm font-bold whitespace-nowrap h-[34px]">Award</button>
                        </div>
                    </li>
                `;
            });
            badgeList.innerHTML = badgeHtml || '<p class="text-sm text-gray-500">No volunteers registered yet.</p>';
        }

        function awardBadge(volId) {
            const input = document.getElementById(`badge-input-${volId}`);
            const badgeName = input.value.trim();
            if (!badgeName) return;

            const db = getDB();
            const vol = db.volunteers.find(v => v.id === volId);
            if (vol) {
                if (!vol.badges) vol.badges = [];
                if (!vol.badges.includes(badgeName)) {
                    vol.badges.push(badgeName);
                    saveDB(db);
                    renderVolunteers();
                } else {
                    alert('Volunteer already has this badge.');
                }
            }
        }

        function approveIdea(id) {
            const db = getDB();
            const idea = db.innovators.find(i => i.id === id);
            if(idea) { idea.status = 'approved'; saveDB(db); renderTable(); }
        }

        function featureIdea(id) {
            const db = getDB();
            const idea = db.innovators.find(i => i.id === id);
            if(idea) { idea.featured = true; saveDB(db); renderTable(); }
        }

        function unfeatureIdea(id) {
            const db = getDB();
            const idea = db.innovators.find(i => i.id === id);
            if(idea) { idea.featured = false; saveDB(db); renderTable(); }
        }
    </script>
</body>
</html>
