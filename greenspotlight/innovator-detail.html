<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Details - GreenBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar-container"></div>
    <div id="modal-container"></div>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div id="detail-container">
            <!-- Rendered by JS -->
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const db = getDB();
            const idea = db.innovators.find(i => i.id === id);

            if (!idea) {
                document.getElementById('detail-container').innerHTML = '<h1 class="text-3xl text-red-500 font-bold">Idea not found!</h1>';
                return;
            }

            const snippet = `<a href="https://greenbridge-demo.vercel.app/innovator-detail.html?id=${idea.id}"><img src="https://img.shields.io/badge/Featured_on-GreenBridge-brightgreen?style=for-the-badge" alt="Featured on GreenBridge"/></a>`;

            document.getElementById('detail-container').innerHTML = `
                <a href="innovators.html" class="inline-flex items-center text-green-600 hover:text-green-800 font-medium mb-6">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Directory
                </a>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
                    <div class="h-64 md:h-96 w-full relative">
                        <img src="${idea.image}" onerror="this.onerror=null;this.src='https://placehold.co/1200x800/png?text=Idea+Image';" class="w-full h-full object-cover">
                        <div class="absolute top-4 left-4 bg-white px-4 py-2 rounded-full font-bold shadow-md text-sm text-gray-800 uppercase tracking-wide">
                            ${idea.category}
                        </div>
                    </div>
                    <div class="p-8 md:p-12">
                        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">${idea.title}</h1>
                        <p class="text-lg text-gray-700 mb-8 leading-relaxed">${idea.description}</p>
                        
                        <div class="grid md:grid-cols-2 gap-8 mb-10">
                            <div class="bg-gray-50 p-6 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center"><i data-lucide="mail" class="mr-2"></i> Contact Details</h3>
                                    <p class="text-gray-600 mb-2">Reach out to collaborate or support this innovation.</p>
                                    <a href="mailto:${idea.contact}" class="text-green-600 font-bold text-lg hover:underline block mb-1">${idea.contact}</a>
                                    ${idea.phone ? `<p class="text-gray-600 mb-4"><i data-lucide="phone" class="w-4 h-4 inline mr-1"></i> ${idea.phone}</p>` : '<div class="mb-4"></div>'}
                                </div>
                                <button onclick="openChatModal('${idea.title.replace(/'/g, "\\'")}')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition shadow-md w-full">
                                    <i data-lucide="message-circle" class="mr-2 w-5 h-5"></i> Chat with Innovator
                                </button>
                            </div>
                            ${(db.currentUser && ['Admin', 'Founder', 'Team Member'].includes(db.currentUser.role)) ? `
                            <div class="bg-green-50 p-6 rounded-2xl border border-green-100">
                                <h3 class="text-xl font-bold text-green-800 mb-4 flex items-center"><i data-lucide="code" class="mr-2"></i> Embed Badge (Admin Only)</h3>
                                <p class="text-sm text-green-700 mb-3">Copy this code to display the GreenBridge badge on the innovator's website.</p>
                                <textarea readonly class="w-full text-xs p-3 rounded bg-white border border-green-200 text-gray-500 mb-3" rows="3">${snippet}</textarea>
                                <button onclick="navigator.clipboard.writeText('${snippet.replace(/'/g, "\\'")}'); alert('Badge copied!');" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-700">Copy Snippet</button>
                            </div>
                            ` : `
                            <div class="bg-gray-50 p-6 rounded-2xl border border-gray-100 flex items-center justify-center text-center">
                                <p class="text-gray-500 text-sm"><i data-lucide="lock" class="w-8 h-8 mx-auto mb-2 text-gray-400"></i>Embed Badge is restricted to GreenBridge Team.</p>
                            </div>
                            `}
                        </div>

                        <div class="border-t border-gray-200 pt-8">
                            <button id="seo-btn" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-purple-700 transition flex items-center">
                                <i data-lucide="sparkles" class="w-5 h-5 mr-2"></i> Generate SEO Description (AI Mock)
                            </button>
                            <div id="seo-result" class="hidden mt-6 bg-purple-50 border-l-4 border-purple-500 p-6 rounded-r-xl">
                                <h4 class="font-bold text-purple-900 mb-2">Auto-Generated SEO Text:</h4>
                                <p class="text-purple-800 text-sm mb-4">"Discover how ${idea.title} is revolutionizing the ${idea.category} sector! This incredible innovation focuses on: ${idea.description} Support sustainable solutions on GreenBridge today!"</p>
                                <h4 class="font-bold text-purple-900 mb-2">Social Media Post:</h4>
                                <p class="text-purple-800 text-sm">🌍 We just discovered an amazing green idea! ${idea.title} is tackling ${idea.category} problems head-on. Check it out on GreenBridge! 🌱♻️ #Sustainability #GreenBridge #Innovation</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('seo-btn').addEventListener('click', () => {
                document.getElementById('seo-result').classList.toggle('hidden');
            });
        });
    </script>
</body>
</html>
