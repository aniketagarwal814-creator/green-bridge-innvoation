<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovators - GreenBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar-container"></div>
    <div id="modal-container"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8">
            <h1 class="text-4xl font-extrabold text-gray-900">Innovator Directory</h1>
            <div class="mt-4 md:mt-0 relative w-full md:w-72">
                <i data-lucide="search" class="absolute left-3 top-3 w-5 h-5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Search ideas..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
        </div>

        <div id="innovators-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Rendered by JS -->
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = getDB();
            // Show only approved ideas
            const approvedIdeas = db.innovators.filter(i => i.status === 'approved');
            
            const renderGrid = (ideas) => {
                const grid = document.getElementById('innovators-grid');
                if (ideas.length === 0) {
                    grid.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-10">No ideas found.</p>`;
                    return;
                }
                grid.innerHTML = ideas.map(idea => `
                    <div class="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow overflow-hidden border border-gray-100 flex flex-col">
                        <div class="h-48 overflow-hidden relative">
                            <img src="${idea.image}" onerror="this.onerror=null;this.src='https://placehold.co/600x400/png?text=Idea+Image';" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3 bg-white/90 text-xs font-bold px-3 py-1 rounded-full">${idea.category}</div>
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="text-xl font-bold mb-2">${idea.title}</h3>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-2 flex-grow">${idea.description}</p>
                            <div class="flex gap-2 w-full mt-auto">
                                <a href="innovator-detail.html?id=${idea.id}" class="text-center flex-1 border border-green-500 text-green-700 hover:bg-green-50 font-medium py-2 rounded-xl transition">View Details</a>
                                <button onclick="openChatModal('${idea.title.replace(/'/g, "\\'")}')" class="flex-1 bg-green-600 text-white hover:bg-green-700 font-medium py-2 rounded-xl transition flex justify-center items-center">
                                    <i data-lucide="message-circle" class="w-4 h-4 mr-1"></i> Connect
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            };

            renderGrid(approvedIdeas);

            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                if (!term) {
                    renderGrid(approvedIdeas);
                    return;
                }
                const filtered = approvedIdeas.filter(i => i.title.toLowerCase().includes(term));
                renderGrid(filtered);
            });
        });
    </script>
</body>
</html>
