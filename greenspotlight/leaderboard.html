<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - GreenSpotlight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar-container"></div>
    <div id="modal-container"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-100 rounded-full mb-4">
                <i data-lucide="trophy" class="w-8 h-8 text-yellow-600"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Global Leaderboard</h1>
            <p class="text-lg text-gray-600">Top volunteers making the biggest impact for a sustainable tomorrow.</p>
        </div>

        <div class="bg-white shadow-xl rounded-3xl overflow-hidden border border-gray-100">
            <ul id="leaderboard-list" class="divide-y divide-gray-100">
                <!-- Rendered by JS -->
            </ul>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = getDB();
            const list = document.getElementById('leaderboard-list');
            
            const sortedVols = db.volunteers.sort((a, b) => b.points - a.points);
            
            if (sortedVols.length === 0) {
                list.innerHTML = `<li class="p-8 text-center text-gray-500">No volunteers yet.</li>`;
                return;
            }

            list.innerHTML = sortedVols.map((vol, index) => {
                let rankVisual = `<span class="text-2xl font-black text-gray-400 w-8 text-center">${index + 1}</span>`;
                if(index === 0) rankVisual = `<i data-lucide="medal" class="w-8 h-8 text-yellow-500 fill-current"></i>`;
                else if(index === 1) rankVisual = `<i data-lucide="medal" class="w-8 h-8 text-gray-400 fill-current"></i>`;
                else if(index === 2) rankVisual = `<i data-lucide="medal" class="w-8 h-8 text-orange-400 fill-current"></i>`;

                const badgeHtml = vol.badges.map(b => `<span class="bg-green-50 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-green-100">${b}</span>`).join(' ');

                return `
                    <li class="p-6 flex items-center hover:bg-gray-50 transition">
                        <div class="flex-shrink-0 mr-6">
                            ${rankVisual}
                        </div>
                        <div class="flex-grow flex items-center justify-between">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900">${vol.name}</h3>
                                <div class="mt-1 flex gap-1">
                                    ${badgeHtml}
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="block text-2xl font-black text-green-600">${vol.points}</span>
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Points</span>
                            </div>
                        </div>
                    </li>
                `;
            }).join('');
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
