<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard - GreenSpotlight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar-container"></div>
    <div id="modal-container"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">NGO Dashboard</h1>
        <p class="text-gray-600 mb-8">Manage your campaigns and reward volunteers.</p>
        
        <div class="grid md:grid-cols-3 gap-8">
            <!-- Create Campaign Form -->
            <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 h-fit">
                <h2 class="text-xl font-bold mb-4">Create New Campaign</h2>
                <form id="create-camp-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Title</label>
                        <input type="text" id="c-title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Location</label>
                        <input type="text" id="c-loc" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Date</label>
                        <input type="date" id="c-date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Volunteers Needed</label>
                        <input type="number" id="c-vols" required min="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Create Campaign</button>
                </form>
            </div>

            <!-- Manage Campaigns -->
            <div class="md:col-span-2 space-y-6" id="my-campaigns-container">
                <!-- Rendered by JS -->
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = getDB();
            const user = db.currentUser;
            
            if (!user || user.role !== 'NGO') {
                alert("Unauthorized! Please login as NGO.");
                window.location.href = 'index.html';
                return;
            }

            renderDashboard();

            // Create Campaign
            document.getElementById('create-camp-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const currentDb = getDB();
                const newCamp = {
                    id: 'camp_' + Date.now(),
                    title: document.getElementById('c-title').value,
                    ngoId: user.id,
                    location: document.getElementById('c-loc').value,
                    date: document.getElementById('c-date').value,
                    volunteersNeeded: parseInt(document.getElementById('c-vols').value),
                    participants: []
                };
                currentDb.campaigns.push(newCamp);
                saveDB(currentDb);
                alert("Campaign created!");
                document.getElementById('create-camp-form').reset();
                renderDashboard();
            });
        });

        window.markCompleted = function(campId, volId) {
            const db = getDB();
            const camp = db.campaigns.find(c => c.id === campId);
            const vol = db.volunteers.find(v => v.id === volId);
            const ngo = db.ngos.find(n => n.id === db.currentUser.id);

            if (camp && vol && ngo) {
                const part = camp.participants.find(p => p.volunteerId === volId);
                if (part && part.status !== 'completed') {
                    part.status = 'completed';
                    
                    // Reward Volunteer
                    vol.points += 50; // Award points
                    
                    const certId = 'CERT-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(Math.random() * 1000);
                    const certData = {
                        id: certId,
                        volunteerId: volId,
                        campaignTitle: camp.title,
                        ngoName: ngo.name,
                        date: new Date().toISOString().split('T')[0],
                        isExternal: false
                    };

                    // Send to Python SQL Backend
                    fetch('http://localhost:5000/api/vault/certificate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(certData)
                    }).catch(err => console.log("Backend offline, skipping SQL save"));

                    // Also save locally for backward compatibility and points/badges calculation
                    vol.certificates.push(certData);

                    // Check for Badge (e.g. 5 campaigns)
                    const completedCount = db.campaigns.reduce((acc, curr) => {
                        return acc + (curr.participants && curr.participants.some(p => p.volunteerId === volId && p.status === 'completed') ? 1 : 0);
                    }, 0);
                    
                    if (completedCount === 5 && !vol.badges.includes('5 Campaigns')) {
                        vol.badges.push('5 Campaigns');
                    }

                    saveDB(db);
                    alert("Volunteer marked as completed. Certificate issued and saved to SQL Vault!");
                    renderDashboard();
                }
            }
        };

        function renderDashboard() {
            const db = getDB();
            const user = db.currentUser;
            const container = document.getElementById('my-campaigns-container');
            const ngo = db.ngos.find(n => n.id === user.id);
            
            // 1. Render NGO Profile Data
            let reviewsHtml = '';
            if (ngo && ngo.reviews && ngo.reviews.length > 0) {
                reviewsHtml = `
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <h4 class="font-bold text-sm text-gray-800 mb-2">Volunteer Feedback</h4>
                        <ul class="space-y-2">
                            ${ngo.reviews.map(r => `
                                <li class="bg-yellow-50 p-3 rounded-xl border border-yellow-100 text-sm">
                                    <p class="text-gray-700 italic">"${r.text}"</p>
                                    <p class="text-xs text-gray-500 mt-1">- ${r.volunteerName} <span class="text-gray-400">(${r.date})</span></p>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            } else {
                reviewsHtml = '<div class="mt-4 pt-4 border-t border-gray-100"><p class="text-xs text-gray-500">No feedback received yet.</p></div>';
            }

            const profileHtml = ngo ? `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">NGO Profile Data</h3>
                    <div class="flex items-center space-x-4 mb-4">
                        <img src="${ngo.image || 'https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=100'}" class="w-16 h-16 rounded-full object-cover shadow-sm">
                        <div>
                            <p class="font-bold text-lg text-gray-800">${ngo.name}</p>
                            <p class="text-sm text-gray-500">${ngo.focusArea || 'General Environment'}</p>
                        </div>
                    </div>
                    <p class="text-gray-600 text-sm mb-2"><strong>Mission:</strong> ${ngo.mission || 'To make the world a greener place.'}</p>
                    ${reviewsHtml}
                </div>
            ` : '';

            // 2. Render Volunteer History for this NGO
            const myCamps = db.campaigns.filter(c => c.ngoId === user.id);
            let historyHtml = '<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6"><h3 class="text-xl font-bold text-gray-900 mb-4">Volunteer History</h3><ul class="divide-y divide-gray-100">';
            let historyCount = 0;
            
            myCamps.forEach(camp => {
                if (camp.participants) {
                    camp.participants.forEach(p => {
                        if (p.status === 'completed') {
                            const volInfo = db.volunteers.find(v => v.id === p.volunteerId);
                            historyHtml += `
                                <li class="py-3 flex justify-between items-center">
                                    <div>
                                        <p class="font-bold text-sm text-gray-800">${volInfo ? volInfo.name : 'Unknown'}</p>
                                        <p class="text-xs text-gray-500">Campaign: ${camp.title} (${camp.date})</p>
                                    </div>
                                    <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded">Completed</span>
                                </li>
                            `;
                            historyCount++;
                        }
                    });
                }
            });
            if (historyCount === 0) historyHtml += '<p class="text-sm text-gray-500">No completed volunteers yet.</p>';
            historyHtml += '</ul></div>';

            // 3. Render Campaigns
            let campaignsHtml = '';
            if (myCamps.length === 0) {
                campaignsHtml = `<div class="bg-white p-8 rounded-2xl text-center text-gray-500 border border-gray-100 shadow-sm">You haven't created any campaigns yet.</div>`;
            } else {
                campaignsHtml = myCamps.map(camp => {
                    const parts = camp.participants || [];
                    const volsHtml = parts.length === 0 
                        ? `<p class="text-sm text-gray-500 italic">No volunteers joined yet.</p>` 
                        : `<ul class="divide-y divide-gray-100">` + parts.map(p => {
                            const volInfo = db.volunteers.find(v => v.id === p.volunteerId);
                            const volName = volInfo ? volInfo.name : 'Unknown';
                            return `
                                <li class="py-3 flex justify-between items-center">
                                    <div>
                                        <p class="font-bold text-sm text-gray-800">${volName}</p>
                                        <p class="text-xs text-gray-500">Status: <span class="capitalize ${p.status === 'completed' ? 'text-green-600' : 'text-yellow-600'}">${p.status}</span></p>
                                    </div>
                                    ${p.status !== 'completed' 
                                        ? `<button onclick="markCompleted('${camp.id}', '${p.volunteerId}')" class="text-xs bg-green-100 hover:bg-green-200 text-green-800 font-bold px-3 py-1.5 rounded transition">Mark Completed</button>`
                                        : `<span class="text-xs font-bold text-green-600 flex items-center"><i data-lucide="check" class="w-4 h-4 mr-1"></i> Done</span>`
                                    }
                                </li>
                            `;
                        }).join('') + `</ul>`;

                    return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl font-bold text-gray-900">${camp.title}</h3>
                            <span class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-full">${camp.date}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-6"><i data-lucide="map-pin" class="w-4 h-4 inline mr-1"></i> ${camp.location} &nbsp;|&nbsp; Target: ${camp.volunteersNeeded} vols</p>
                        
                        <div class="bg-gray-50 rounded-xl p-4">
                            <h4 class="text-sm font-bold text-gray-700 mb-3 border-b border-gray-200 pb-2">Registered Volunteers</h4>
                            ${volsHtml}
                        </div>
                    </div>
                `}).join('');
            }

            container.innerHTML = profileHtml + historyHtml + campaignsHtml;
            lucide.createIcons();
        }
    </script>
</body>
</html>
