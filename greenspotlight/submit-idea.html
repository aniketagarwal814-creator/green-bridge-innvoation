<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Idea - GreenBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar-container"></div>
    <div id="modal-container"></div>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full grid md:grid-cols-2 gap-8">
        
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Submit Your Innovation</h1>
            <p class="text-gray-600 mb-8">Share your sustainable idea. Our admins will review it.</p>
            
            <form id="submit-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Project Title</label>
                    <input type="text" id="i-title" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Category</label>
                    <select id="i-category" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                        <option>Plastic alternatives</option>
                        <option>Energy</option>
                        <option>Waste</option>
                        <option>Water</option>
                        <option>Agriculture</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Description</label>
                    <textarea id="i-desc" required rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Innovator Name (Verified)</label>
                    <input type="text" id="i-name" readonly class="w-full px-4 py-3 border border-gray-200 bg-gray-100 text-gray-500 rounded-xl focus:outline-none cursor-not-allowed" value="Demo Innovator">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Contact Email (Verified)</label>
                    <input type="email" id="i-contact" readonly class="w-full px-4 py-3 border border-gray-200 bg-gray-100 text-gray-500 rounded-xl focus:outline-none cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Contact Number (Verified)</label>
                    <input type="text" id="i-phone" readonly class="w-full px-4 py-3 border border-gray-200 bg-gray-100 text-gray-500 rounded-xl focus:outline-none cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Upload Image</label>
                    <input type="file" id="i-image" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-lg text-lg">Submit for Approval</button>
            </form>
        </div>

        <div class="bg-gray-50 p-8 rounded-3xl border border-gray-200 h-fit">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center"><i data-lucide="clipboard-list" class="w-6 h-6 mr-2 text-green-600"></i> My Idea Tracker</h2>
            <div id="tracker-list" class="space-y-4">
                <!-- Rendered by JS -->
            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="js/db.js"></script>
    <script src="js/components.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const db = getDB();
            if(!db.currentUser || db.currentUser.role !== 'Innovator') {
                alert("Please log in as an Innovator to submit an idea.");
                window.location.href = 'index.html';
                return;
            }
            
            // Lock inputs to prevent fake entries
            document.getElementById('i-name').value = db.currentUser.name || 'Demo Innovator';
            document.getElementById('i-contact').value = db.currentUser.email || 'demo@greenbridge.com';
            document.getElementById('i-phone').value = db.currentUser.phone || '+1 (555) 000-0000';
            
            renderTracker();

            document.getElementById('submit-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('i-title').value;
                const category = document.getElementById('i-category').value;
                const desc = document.getElementById('i-desc').value;
                const contact = document.getElementById('i-contact').value;
                const phone = document.getElementById('i-phone').value;
                const imageFile = document.getElementById('i-image').files[0];

                if(!imageFile) return alert("Please select an image");

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const base64String = canvas.toDataURL('image/jpeg', 0.7);
                        const currentDb = getDB();
                        
                        const newIdea = {
                            id: 'idea_' + Date.now(),
                            authorId: currentDb.currentUser.id,
                            title: title,
                            category: category,
                            description: desc,
                            contact: contact,
                            phone: phone,
                            image: base64String,
                            featured: false,
                            status: 'pending'
                        };

                        currentDb.innovators.push(newIdea);
                        
                        try {
                            saveDB(currentDb);
                            alert("Your idea has been submitted successfully!");
                            document.getElementById('submit-form').reset();
                            renderTracker();
                        } catch (err) {
                            alert("Storage quota exceeded! Please clear local storage or try a smaller image.");
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(imageFile);
            });
        });

        function renderTracker() {
            const db = getDB();
            const list = document.getElementById('tracker-list');
            const myIdeas = db.innovators.filter(i => i.authorId === db.currentUser.id);

            if(myIdeas.length === 0) {
                list.innerHTML = '<p class="text-gray-500 italic text-sm">You have not submitted any ideas yet.</p>';
                return;
            }

            list.innerHTML = myIdeas.map(idea => {
                let statusBadge = '';
                if(idea.status === 'pending') statusBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded-full"><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i> Pending Review</span>';
                else if(idea.status === 'approved') statusBadge = '<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-full"><i data-lucide="check" class="w-3 h-3 inline mr-1"></i> Approved</span>';
                else statusBadge = '<span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded-full"><i data-lucide="x" class="w-3 h-3 inline mr-1"></i> Rejected</span>';

                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4">
                        <div class="w-24 h-24 flex-shrink-0">
                            <img src="${idea.image}" onerror="this.onerror=null;this.src='https://placehold.co/400x400/png?text=Idea';" class="w-full h-full object-cover rounded-lg border border-gray-200">
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-gray-900 line-clamp-1">${idea.title}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-gray-500 mb-2">Token ID: <span class="font-mono text-gray-700">${idea.id}</span></p>
                            <p class="text-xs text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded">${idea.category}</p>
                        </div>
                    </div>
                `;
            }).reverse().join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
